# Две проверки на каждый push и pull request: тесты и заслон для секретов.
#
# Вторая — не формальность. В issue и PR попадает то, что человек собрал
# руками: кусок лога, адрес ленты, тестовые данные. Один раз пропущенный
# токен из репозитория уже не вычистишь — его придётся отзывать. Поэтому
# проверка идёт по всем файлам репозитория тем же фильтром, что стоит перед
# отправкой в языковую модель (`newsdigest/redact.py`).
#
# Заведомо игрушечный пример ключа (тесты, документация) помечается в той же
# строке комментарием `nd-redact: allow`.
name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Тесты
        run: python3 -m unittest discover -s tests

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Нет ли в репозитории секретов
        run: git ls-files -z | xargs -0 python3 digest.py scrub --check
